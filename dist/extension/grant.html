<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FR24 LADD Unblocker: allow your monitor</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; background: #23272e; color: #e6e6e6; margin: 0; padding: 48px 16px; }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  code { background: #2f343c; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
  button { font: inherit; background: #1f6feb; color: #fff; border: 0; border-radius: 6px; padding: 8px 18px; cursor: pointer; margin-top: 16px; }
  #msg { margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>Allow your own monitor</h1>
  <p>You set the extension to use the monitor at <code id="origin"></code>. Your browser needs your permission before the extension can reach it.</p>
  <button id="allow" type="button">Allow</button>
  <p id="msg"></p>
</main>
<script src="grant.js"></script>
</body>
</html>
