# The project website (site/) on GitHub Pages: https://finlayc1.github.io/fr24-ladd-unblocker/
# One-time setup: the repository's Settings > Pages > Build and deployment > Source: "GitHub Actions".
# The shared graphics live in docs/assets (the README uses them too) and are copied into the site when it is deployed.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Shared graphics from docs/assets
        run: |
          mkdir -p site/assets
          find docs/assets -maxdepth 1 -type f \( -name '*.svg' -o -name '*.png' \) -exec cp {} site/assets/ \;
          ls -l site/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
