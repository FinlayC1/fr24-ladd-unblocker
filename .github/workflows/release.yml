# A release: a tag v<version> (the version in package.json) - pushed, or made on GitHub's Releases page ("Draft a new
# release", a new tag, Publish) - and this builds the extension and the userscript and attaches them to the release, with
# that version's changelog entry as its notes.
#   git tag v22.22.0 && git push origin v22.22.0
name: Release
on:
  push:
    tags: ['v*']
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The tag is the version being built
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Release notes from the changelog
        run: |
          node -e "
            const s = require('fs').readFileSync('CHANGELOG.md', 'utf8'), v = process.argv[1].replace(/^v/, '');
            const i = s.indexOf('## [' + v + ']'); if (i < 0) { console.log('Version ' + v); process.exit(0); }
            const j = s.indexOf('\n## [', i + 1); console.log(s.slice(s.indexOf('\n', i) + 1, j < 0 ? undefined : j).trim());
          " "$GITHUB_REF_NAME" > notes.md
          printf '\n\n---\n**Install:** Chrome / Edge - download `fr24-ladd-unblocker-extension.zip`, unzip it, then *Load unpacked* in `chrome://extensions` (Developer mode). Tampermonkey - open `fr24-ladd-unblocker.user.js`.\n' >> notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (a release already made on GitHub's page for this tag: the files and notes added to it; otherwise made here)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/fr24-ladd-unblocker-extension.zip dist/fr24-ladd-unblocker.user.js --clobber
            gh release edit "$GITHUB_REF_NAME" --title "FR24 LADD Unblocker $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/fr24-ladd-unblocker-extension.zip dist/fr24-ladd-unblocker.user.js --title "FR24 LADD Unblocker $GITHUB_REF_NAME" --notes-file notes.md
          fi
