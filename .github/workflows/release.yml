# A release: push a tag v<version> (the version in package.json) and this builds the extension and the userscript and
# publishes them as a GitHub release, with that version's changelog entry as its notes.
#   git tag v22.21.0 && git push origin v22.21.0
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The tag is the version being built
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Release notes from the changelog
        run: |
          node -e "
            const s = require('fs').readFileSync('CHANGELOG.md', 'utf8'), v = process.argv[1].replace(/^v/, '');
            const i = s.indexOf('## [' + v + ']'); if (i < 0) { console.log('Version ' + v); process.exit(0); }
            const j = s.indexOf('\n## [', i + 1); console.log(s.slice(s.indexOf('\n', i) + 1, j < 0 ? undefined : j).trim());
          " "$GITHUB_REF_NAME" > notes.md
          printf '\n\n---\n**Install:** Chrome / Edge - download `fr24-ladd-unblocker-extension.zip`, unzip it, then *Load unpacked* in `chrome://extensions` (Developer mode). Tampermonkey - open `fr24-ladd-unblocker.user.js`.\n' >> notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/fr24-ladd-unblocker-extension.zip dist/fr24-ladd-unblocker.user.js --title "FR24 LADD Unblocker $GITHUB_REF_NAME" --notes-file notes.md
