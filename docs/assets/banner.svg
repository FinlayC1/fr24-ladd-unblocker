<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="FR24 LADD Unblocker - every blocked aircraft on Flightradar24, named, routed and logged from public ADS-B">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120f1d"/>
      <stop offset="0.55" stop-color="#1f1833"/>
      <stop offset="1" stop-color="#2d2150"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#f5b301" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f5b301" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <symbol id="plane" viewBox="0 0 24 24">
      <path d="M12 1.5C11.2 1.5 10.6 2.2 10.6 3V9.2L2.5 14V16.2L10.6 13.8V19L8.3 20.8V22.5L12 21.4L15.7 22.5V20.8L13.4 19V13.8L21.5 16.2V14L13.4 9.2V3C13.4 2.2 12.8 1.5 12 1.5Z"/>
    </symbol>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>
  <!-- radar rings -->
  <g fill="none" stroke="#f5b301" stroke-opacity="0.16">
    <circle cx="1000" cy="168" r="70"/>
    <circle cx="1000" cy="168" r="140"/>
    <circle cx="1000" cy="168" r="210" stroke-opacity="0.08"/>
  </g>
  <!-- a blocked flight's track: dashed where nobody hears it, solid where public ADS-B does -->
  <path d="M640 340 C 760 300, 820 250, 900 215" fill="none" stroke="#f5b301" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="6 9" stroke-linecap="round"/>
  <path d="M900 215 C 950 190, 975 178, 1000 168" fill="none" stroke="#f5b301" stroke-width="3.5" stroke-linecap="round"/>
  <g transform="translate(1000 168) rotate(62) translate(-26 -26)" fill="#f5b301"><use href="#plane" width="52" height="52"/></g>
  <!-- the label FR24 leaves empty, filled in -->
  <g transform="translate(1040 92)">
    <rect width="200" height="58" rx="8" fill="#0d0b14" fill-opacity="0.82" stroke="#f5b301" stroke-opacity="0.5"/>
    <text x="14" y="25" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">DEMO01</text>
    <rect x="98" y="11" width="46" height="18" rx="4" fill="#f5b301"/>
    <text x="121" y="24.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#1b1b1b">LADD</text>
    <text x="14" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c9c3dc">LBG → TEB · predicted 64%</text>
  </g>
  <!-- other traffic -->
  <g fill="#ffffff" fill-opacity="0.18">
    <g transform="translate(780 90) rotate(-30) translate(-11 -11)"><use href="#plane" width="22" height="22"/></g>
    <g transform="translate(1180 300) rotate(200) translate(-11 -11)"><use href="#plane" width="22" height="22"/></g>
    <g transform="translate(870 330) rotate(110) translate(-11 -11)"><use href="#plane" width="22" height="22"/></g>
    <g transform="translate(1210 210) rotate(-80) translate(-9 -9)"><use href="#plane" width="18" height="18"/></g>
  </g>
  <!-- title -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="150" font-size="60" font-weight="800" fill="#ffffff" letter-spacing="-1">FR24 LADD</text>
    <text x="72" y="216" font-size="60" font-weight="800" fill="#f5b301" letter-spacing="-1">Unblocker</text>
    <text x="74" y="266" font-size="21" fill="#d8d3e8">Every blocked aircraft on Flightradar24 -</text>
    <text x="74" y="294" font-size="21" fill="#d8d3e8">named, routed and logged from public ADS-B.</text>
    <text x="74" y="346" font-size="14" font-weight="600" fill="#9c93b8" letter-spacing="2">CHROME · EDGE · TAMPERMONKEY · SELF-HOSTED MONITOR</text>
  </g>
</svg>
